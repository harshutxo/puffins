<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Puffins">
  <!-- "Puff" as the nav logo/home button — redesigned from scratch to match the
       brand's mascot reference art (P:\Games\puffins-main\Puff): a puffed-rice
       head worn like a kid's, navy cap with a gradient logo dot, navy hoodie
       collar. Replaces the earlier abstract swirl-on-badge placeholder mark.
       Draw order: hoodie collar (so the head overlaps its top), head, texture/
       face, cap last (sits on top of the head). -->
  <defs>
    <linearGradient id="puffLogoDot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17b3a3"/>
      <stop offset="35%" stop-color="#6a4bd6"/>
      <stop offset="65%" stop-color="#d6389a"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
  </defs>

  <!-- hoodie collar -->
  <rect x="16" y="52" width="32" height="16" rx="10" fill="#16274a" stroke="#FFF7EE" stroke-width="1.6"/>
  <line x1="28" y1="56" x2="27" y2="62" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>
  <line x1="36" y1="56" x2="37" y2="62" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>

  <!-- puffed-rice head -->
  <circle cx="32" cy="37" r="22" fill="#FFF7EE" stroke="#0F2740" stroke-width="2"/>
  <circle cx="21" cy="29" r="1.7" fill="#c9b696"/>
  <circle cx="41" cy="26" r="1.5" fill="#c9b696"/>
  <circle cx="38" cy="47" r="1.6" fill="#c9b696"/>
  <circle cx="19" cy="43" r="1.3" fill="#c9b696"/>
  <circle cx="46" cy="37" r="1.5" fill="#c9b696"/>
  <circle cx="29" cy="21" r="1.2" fill="#c9b696"/>

  <!-- blush -->
  <circle cx="17" cy="36" r="3" fill="#FF8A00" opacity=".35"/>
  <circle cx="46" cy="36" r="3" fill="#FF8A00" opacity=".35"/>

  <!-- eyebrows -->
  <path d="M17,25 Q22,20 28,24" stroke="#0F2740" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M36,23 Q41,19 47,22" stroke="#0F2740" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="24" cy="32" r="3.4" fill="#0F2740"/>
  <circle cx="41" cy="31" r="3" fill="#0F2740"/>
  <circle cx="25.3" cy="30.6" r="1.1" fill="#fff"/>
  <circle cx="42.2" cy="29.7" r="1" fill="#fff"/>

  <!-- smile -->
  <path d="M21,42 Q32,51 44,41" stroke="#0F2740" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- cap -->
  <ellipse cx="32" cy="15" rx="21" ry="11" fill="#16274a" stroke="#FFF7EE" stroke-width="2"/>
  <ellipse cx="50" cy="21" rx="8" ry="3.3" fill="#16274a" stroke="#FFF7EE" stroke-width="1.6" transform="rotate(-15 50 21)"/>
  <circle cx="32" cy="12" r="2.8" fill="url(#puffLogoDot)"/>
</svg>
